name: Android APK Build & Sign

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Gradle build variant to assemble and sign'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  KEYSTORE_PATH: 'app/release-keystore.jks'

jobs:
  build-and-sign-apk:
    name: Build & Sign Whisper.cpp Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository (with whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle Cache & Execution Permissions
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Ensure gradlew is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Validate Signing Secrets Presence
        id: check_secrets
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_STORE_PASS" = "true" ] && [ "$HAS_KEY_ALIAS" = "true" ] && [ "$HAS_KEY_PASS" = "true" ]; then
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
            echo "All 4 Android signing secrets are configured."
          else
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing one or more required signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi

      - name: Decode Keystore from GitHub Secrets
        if: steps.check_secrets.outputs.signing_ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${{ env.KEYSTORE_PATH }}"
          test -s "${{ env.KEYSTORE_PATH }}" || (echo "::error::Decoded keystore file is empty" && exit 1)

      - name: Run Unit Tests (Transcript Append & Audio Prep Boundaries)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build & Sign Release APK via Gradle
        env:
          KEYSTORE_FILE_PATH: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: 0.1.0-ci.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Cryptographic Signature (v2/v3 Scheme)
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Signed release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi
          echo "Verifying signature on: $APK_FILE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"

          SIGNED_OUT="app/build/outputs/apk/release/speakdraft-base-en-ci-${{ github.run_number }}-signed.apk"
          cp "$APK_FILE" "$SIGNED_OUT"
          sha256sum "$SIGNED_OUT" > "${SIGNED_OUT}.sha256"
          echo "signed_apk_path=$SIGNED_OUT" >> "$GITHUB_ENV"

      - name: Upload Signed APK & Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speakdraft-signed-apk-build-${{ github.run_number }}
          path: |
            ${{ env.signed_apk_path }}
            ${{ env.signed_apk_path }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Securely Shred Temporary Keystore File
        if: always()
        run: |
          if [ -f "${{ env.KEYSTORE_PATH }}" ]; then
            shred -u "${{ env.KEYSTORE_PATH }}" 2>/dev/null || rm -f "${{ env.KEYSTORE_PATH }}"
            echo "Temporary keystore removed from runner."
          fi
