name: Android Tag Release (Build, Sign & Publish)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
      - 'v*'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  KEYSTORE_PATH: 'app/release-keystore.jks'

jobs:
  release-signed-apk:
    name: Build, Sign & Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Tagged Commit (with whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract Semantic Version from Git Tag
        id: version
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${RAW_TAG#v}"

          # Compute deterministic monotonic integer versionCode from Major.Minor.Patch (e.g. v1.2.3 -> 10203)
          IFS='.-' read -r MAJOR MINOR PATCH EXTRA <<< "$VERSION_NAME"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$VERSION_CODE" -le 0 ]; then
            VERSION_CODE=1
          fi

          # Mark pre-release if tag contains -alpha, -beta, or -rc
          if [[ "$RAW_TAG" == *"-"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "tag_name=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Preparing release for Tag=${RAW_TAG}, VersionName=${VERSION_NAME}, VersionCode=${VERSION_CODE}"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Decode Signing Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured in repository settings."
            exit 1
          fi
          mkdir -p app
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${{ env.KEYSTORE_PATH }}"
          test -s "${{ env.KEYSTORE_PATH }}" || (echo "::error::Decoded keystore is empty" && exit 1)

      - name: Run Unit Tests Before Packaging Release
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble & Sign Release APK with Provided Version
        env:
          KEYSTORE_FILE_PATH: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Signature & Prepare Release Artifacts
        id: package_artifact
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::Failed to locate built release APK."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_SOURCE"

          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          ARTIFACT_NAME="speakdraft-base-en-${{ steps.version.outputs.tag_name }}-signed.apk"
          ARTIFACT_PATH="${ARTIFACT_DIR}/${ARTIFACT_NAME}"

          cp "$APK_SOURCE" "$ARTIFACT_PATH"
          (cd "$ARTIFACT_DIR" && sha256sum "$ARTIFACT_NAME" > "${ARTIFACT_NAME}.sha256")

          echo "apk_path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"
          echo "sha_path=${ARTIFACT_PATH}.sha256" >> "$GITHUB_OUTPUT"
          echo "apk_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Attach Signed APK Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "SpeakDraft ${{ steps.version.outputs.tag_name }}"
          body: |
            ## SpeakDraft Offline English Transcription (${{ steps.version.outputs.tag_name }})

            ### Release Build Metadata
            - **Version Name:** `${{ steps.version.outputs.version_name }}`
            - **Version Code:** `${{ steps.version.outputs.version_code }}`
            - **Speech Engine:** `whisper.cpp` (on-device C/C++ inference via JNI)
            - **Target Speech Model:** `ggml-base.en.bin` (English-only Base model, ~141.11 MB)
            - **Signed Artifact:** `${{ steps.version.outputs.apk_name }}` (Verified Android v2/v3 APK Signature)

            ### Verification Checksum
            See attached `${{ steps.version.outputs.apk_name }}.sha256` to verify APK integrity prior to sideloading.
          files: |
            ${{ steps.package_artifact.outputs.apk_path }}
            ${{ steps.package_artifact.outputs.sha_path }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifacts to Workflow Summary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag_name }}
          path: |
            ${{ steps.package_artifact.outputs.apk_path }}
            ${{ steps.package_artifact.outputs.sha_path }}
          retention-days: 90

      - name: Securely Shred Temporary Keystore File
        if: always()
        run: |
          if [ -f "${{ env.KEYSTORE_PATH }}" ]; then
            shred -u "${{ env.KEYSTORE_PATH }}" 2>/dev/null || rm -f "${{ env.KEYSTORE_PATH }}"
            echo "Temporary keystore securely removed."
          fi
