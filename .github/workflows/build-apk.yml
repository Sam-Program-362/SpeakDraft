# =============================================================================
# build-apk.yml
# -----------------------------------------------------------------------------
# Builds a SIGNED release APK and uploads it as a workflow artifact.
#
# Signing uses four repository secrets (configured in:
#   Repository Settings -> Secrets and variables -> Actions):
#   - KEYSTORE_BASE64     : base64-encoded release keystore (.jks/.keystore)
#   - KEYSTORE_PASSWORD   : password protecting the keystore
#   - KEY_ALIAS           : alias of the signing key inside the keystore
#   - KEY_PASSWORD        : password of the signing key
#
# How the app consumes these: app/build.gradle.kts reads KEYSTORE_FILE,
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD from the environment. This
# workflow decodes KEYSTORE_BASE64 into a keystore file and exports
# KEYSTORE_FILE to the environment so the Gradle signing config picks it up.
#
# Trigger: push to main/develop, pull requests, or manual dispatch.
# On pull requests from forks the signing secrets are unavailable, so the
# workflow falls back to building an unsigned debug APK (still validates
# compilation, native build, and unit tests).
# =============================================================================
name: Build Signed APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Forwarded to the Gradle signing config (see app/build.gradle.kts).
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: ubuntu-latest runners already ship the Android SDK
      # (cmdline-tools, platforms, build-tools) under $ANDROID_HOME
      # (/usr/local/lib/android/sdk). The third-party
      # android-actions/setup-android action is intentionally NOT used:
      # it fails on current runners (Node.js 24 runtime, exit 127).
      # We locate sdkmanager via $ANDROID_HOME and install only what
      # this project pins (see app/build.gradle.kts).
      - name: Install Android SDK components (platform, build-tools, NDK, CMake)
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is not configured; building unsigned debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tolerate trailing newlines/spaces from copy-paste.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > keystore/release.keystore
          if [ ! -s keystore/release.keystore ]; then
            echo "::error::Decoded keystore is empty. Check the KEYSTORE_BASE64 secret." >&2
            exit 1
          fi
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/keystore/release.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore decoded."

      - name: Download Whisper base.en model into assets
        run: bash app/download_model.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace > gradle-test.log 2>&1
          CODE=$?
          tail -n 60 gradle-test.log
          if [ $CODE -ne 0 ]; then
            echo "--- Gradle failure summary ---"
            grep -E "FAILED|error:|e: |Exception|What went wrong|Execution failed" gradle-test.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $CODE
          fi

      - name: Build release APK (signed when keystore is present)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n1)"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          echo "Verifying signature of $APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: speakdraft-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: speakdraft-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Securely shred temporary keystore
        if: always()
        run: |
          if [ -f keystore/release.keystore ]; then
            shred -u keystore/release.keystore || rm -f keystore/release.keystore
          fi
