# =============================================================================
# build-apk.yml
# -----------------------------------------------------------------------------
# Builds a SIGNED release APK and uploads it as a workflow artifact.
#
# Signing uses four repository secrets (configured in:
#   Repository Settings -> Secrets and variables -> Actions):
#   - KEYSTORE_BASE64     : base64-encoded release keystore (.jks/.keystore)
#   - KEYSTORE_PASSWORD   : password protecting the keystore
#   - KEY_ALIAS           : alias of the signing key inside the keystore
#   - KEY_PASSWORD        : password of the signing key
#
# How the app consumes these: app/build.gradle.kts reads KEYSTORE_FILE,
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD from the environment. This
# workflow decodes KEYSTORE_BASE64 into a keystore file and exports
# KEYSTORE_FILE to the environment so the Gradle signing config picks it up.
#
# Trigger: push to main/develop, or manual dispatch.
# =============================================================================
name: Build Signed APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # These are forwarded to the Gradle signing config (see app/build.gradle.kts).
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/keystore/release.keystore" >> "$GITHUB_ENV"
          echo "Release keystore decoded."

      - name: Download Whisper base.en model into assets
        run: bash app/download_model.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: speakdraft-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: speakdraft-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30
