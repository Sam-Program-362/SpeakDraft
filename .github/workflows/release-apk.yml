# =============================================================================
# release-apk.yml
# -----------------------------------------------------------------------------
# Triggered by pushing a tag that starts with "v" (e.g. v1.0.0, v1.2.3-beta).
#
# It builds a SIGNED release APK exactly like build-apk.yml, then creates a
# GitHub Release for the tag and attaches the signed APK as a release asset.
#
# Signing uses the same four repository secrets:
#   - KEYSTORE_BASE64
#   - KEYSTORE_PASSWORD
#   - KEY_ALIAS
#   - KEY_PASSWORD
#
# Because a published release must be signed, this workflow FAILS if
# KEYSTORE_BASE64 is not configured (unlike build-apk.yml, which also fails
# when the secret is missing, but here it is a hard requirement for the asset).
# =============================================================================
name: Release Signed APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK and CMake
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required to build a signed release APK." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/keystore/release.keystore" >> "$GITHUB_ENV"
          echo "Release keystore decoded."

      - name: Download Whisper base.en model into assets
        run: bash app/download_model.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SpeakDraft ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
